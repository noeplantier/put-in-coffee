# ══════════════════════════════════════════════════════════════
#  put.in coffee — netlify.toml  ·  FIXED build
#  Root cause: corrupted node_modules — solved with npm ci
# ══════════════════════════════════════════════════════════════

[build]
  # ⚠️  "base" must match your repo subfolder exactly
  base    = "astro-sanity-project"
  # npm ci deletes node_modules and does a clean install from package-lock.json
  # This fixes "Cannot find module .../vite/dist/node/chunks/logger.js"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Pin to an exact LTS version — avoids surprise upgrades on Netlify
  NODE_VERSION = "20.18.0"
  # Avoid peer dependency conflicts without unsafe-legacy
  NPM_FLAGS    = "--prefer-offline"

[dev]
  command    = "npm run dev"
  port       = 4321
  targetPort = 4321
  autoLaunch = false

# ── Security headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), autoplay=(self), picture-in-picture=(self)"
    Cache-Control             = "public, max-age=0, must-revalidate"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.openstreetmap.org https://*.cartocdn.com https://*.tile.openstreetmap.org https://www.google.com https://maps.googleapis.com; connect-src 'self' https://plausible.io https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ── Redirects ─────────────────────────────────────────────────
[[redirects]]
  from = "http://putincoffee.com/*"
  to   = "https://www.putincoffee.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.putincoffee.com/*"
  to   = "https://www.putincoffee.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://putincoffee.com/*"
  to   = "https://www.putincoffee.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/ig"
  to   = "https://www.instagram.com/put.in.coffee/"
  status = 302

[[redirects]]
  from = "/wa"
  to   = "https://wa.me/6281916334989"
  status = 302

[[redirects]]
  from = "/maps"
  to   = "https://www.google.com/maps/search/put.in+coffee+Pantai+Biaung+Denpasar"
  status = 302

[[redirects]]
  from = "/order"
  to   = "https://www.instagram.com/put.in.coffee/"
  status = 302

[[redirects]]
  from = "/tiktok"
  to   = "https://www.tiktok.com/@put.in_coffee"
  status = 302

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Forms ─────────────────────────────────────────────────────
[forms]
  spam_filter = true

# ── Functions ─────────────────────────────────────────────────
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"